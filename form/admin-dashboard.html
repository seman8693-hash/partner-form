<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard Partner</title>

<style>
body{
  font-family:Arial;
  background:#f4f4f4;
  margin:0;
}

header{
  background:#28a745;
  color:#fff;
  padding:15px;
  text-align:center;
}

.container{
  padding:15px;
}

.card{
  background:#fff;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

img,video{
  width:100%;
  border-radius:8px;
  margin-top:8px;
}

.btn{
  padding:8px;
  border:none;
  cursor:pointer;
  margin-top:10px;
  border-radius:6px;
}

.del{
  background:red;
  color:#fff;
}

.info{
  margin:5px 0;
  font-size:14px;
}

.info b{
  color:#28a745;
}

.empty{
  text-align:center;
  padding:30px;
  color:#999;
}
</style>
</head>

<body>

<header>
<h2>ADMIN DASHBOARD PARTNER</h2>
</header>

<div class="container" id="list"></div>

<script>
let data = JSON.parse(localStorage.getItem("partners")) || [];

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  if(data.length === 0){
    list.innerHTML = '<div class="empty"><p>Belum ada data partner</p></div>';
    return;
  }

  data.forEach((p,i)=>{
    list.innerHTML += `
      <div class="card">
        <h3>${p.produk.nama}</h3>
        
        <div class="info">
          <b>Perusahaan:</b> ${p.perusahaan}
        </div>
        <div class="info">
          <b>PIC:</b> ${p.pic}
        </div>
        <div class="info">
          <b>WhatsApp:</b> ${p.wa}
        </div>

        <hr style="margin:10px 0;border:none;border-top:1px solid #eee;">

        <div class="info">
          <b>Kategori:</b> ${p.produk.kategori}
        </div>
        <div class="info">
          <b>Harga:</b> Rp ${parseInt(p.produk.harga).toLocaleString('id-ID')}
        </div>
        <div class="info">
          <b>Stok:</b> ${p.produk.stok || '-'}
        </div>
        <div class="info">
          <b>Minimal Beli:</b> ${p.produk.minPembelian || '-'}
        </div>
        <div class="info">
          <b>Berat:</b> ${p.produk.berat || '-'} Kg
        </div>
        <div class="info">
          <b>Volume:</b> ${p.produk.volume || '-'}
        </div>
        <div class="info">
          <b>Fee:</b> ${p.produk.fee || '0'}%
        </div>

        <div class="info">
          <b>Deskripsi:</b> ${p.produk.deskripsi}
        </div>

        ${p.media.foto ? `<img src="${p.media.foto}" alt="Foto Produk">` : ''}
        ${p.media.video ? `<video controls src="${p.media.video}"></video>` : ''}

        <div class="info" style="margin-top:15px;">
          <small style="color:#999;">📅 ${p.time}</small>
        </div>

        <button class="btn del" onclick="hapus(${i})">🗑️ Hapus</button>
      </div>
    `;
  });
}

function hapus(i){
  if(confirm("Hapus data ini?")){
    data.splice(i,1);
    localStorage.setItem("partners",JSON.stringify(data));
    render();
  }
}

render();
</script>

</body>
</html>
